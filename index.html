<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singly Linked List — شرح بالرسم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Singly Linked List</h1>
  <p>اختار العملية من فوق، وبعدين اختار مثال، وامشي على الكود خطوة بخطوة.</p>
</header>
<nav id="nav" aria-label="العمليات"></nav>
<main>
  <section class="info">
    <h2 id="ttl"></h2>
    <p id="dsc"></p>
    <div id="cases" role="group" aria-label="الأمثلة"></div>
    <code id="call" dir="ltr"></code>
  </section>
  <section class="grid">
    <div class="stage">
      <div id="view" dir="ltr"></div>
      <pre id="out" dir="ltr"></pre>
    </div>
    <pre id="code" dir="ltr"></pre>
  </section>
  <div class="ctl">
    <button id="bk">السابق</button>
    <button id="pl">تشغيل</button>
    <button id="nx">التالي</button>
    <button id="rs">من الأول</button>
    <span id="cnt"></span>
  </div>
  <p id="step" aria-live="polite"></p>
</main>
<script src="script.js"></script>
</body>
</html>
